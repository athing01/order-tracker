apiVersion: 1

contactPoints:
  - orgId: 1
    name: taskflow-q6-responder
    receivers:
      - uid: taskflow-q6-responder
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://10.215.24.1:8001/alerts
          httpMethod: POST

groups:
  - orgId: 1
    name: 'Order Tracker Alerts'
    folder: 'Alerts'
    interval: 1m
    rules:
      - title: 'HTTP 5xx Errors'
        uid: 'q4-http-5xx-alert'
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: 'PBFA97CFB590B2093'
            model:
              expr: 'sum by (http_route) (rate(http_requests_total{http_status_code=~"5.."}[1m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
        for: 0m
        annotations:
          summary: 'HTTP 5xx errors detected on {{ $labels.http_route }}'
          description: 'The endpoint {{ $labels.http_route }} is returning 5xx errors over the last 1 minute. View the Order Tracker Request Dashboard: http://localhost:3000/d/order-tracker-request/order-tracker-request-dashboard'
        labels:
          severity: critical
        noDataState: OK
        execErrState: OK
        notification_settings:
          receiver: taskflow-q6-responder
