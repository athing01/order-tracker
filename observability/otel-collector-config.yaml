receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
    # We'll try this. Loki OTLP receiver endpoint is usually /otlp/v1/logs
    # for HTTP. The otlp_http exporter adds /v1/logs.
    # So http://loki:3100/otlp should result in http://loki:3100/otlp/v1/logs.
  otlp_http/tempo:
    endpoint: "http://tempo:4318"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
